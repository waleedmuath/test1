<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faz3at E5tebar Reel</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #111113; --fg: #F9F8F6; --accent: #FF5C00; --dim: #8B857D; --edge: #2B2B30; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font: 500 14px/1.4 Alexandria, system-ui, sans-serif;
    display: grid; place-items: center; padding: 16px; }
  main { width: min(100%, calc((100vh - 120px) * 9 / 16), 480px); display: grid; gap: 12px; }
  .screen { position: relative; aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
  .start { position: absolute; inset: auto 0 24px; margin: auto; width: fit-content; border: 0; border-radius: 99px; padding: 12px 22px;
    background: var(--accent); color: #0B0B0C; font: inherit; font-weight: 700; cursor: pointer; }
  .start[hidden] { display: none; }
  .controls { display: flex; align-items: center; gap: 10px; }
  .controls button { border: 1px solid var(--edge); background: transparent; color: var(--fg); border-radius: 99px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .controls input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .time { font: 600 13px "JetBrains Mono", monospace; color: var(--dim); min-width: 46px; text-align: end; }
  .langs { display: flex; gap: 4px; }
  .langs a { color: var(--dim); text-decoration: none; border: 1px solid var(--edge); border-radius: 99px; padding: 6px 10px; }
  .langs a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #0B0B0C; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.capture { display: block; padding: 0; background: black; }
  body.capture main { width: 1080px; }
  body.capture .screen { width: 1080px; height: 1920px; border-radius: 0; box-shadow: none; }
  body.capture .controls, body.capture .start { display: none; }
</style>
</head>
<body>
  <main>
    <div class="screen">
      <canvas id="reel" width="1080" height="1920" aria-label="Faz3at E5tebar reel"></canvas>
      <button class="start" id="start" type="button">▶ Play with sound</button>
    </div>
    <div class="controls">
      <button id="toggle" type="button">Play</button>
      <input id="seek" type="range" min="0" max="30" step="0.001" value="0" aria-label="Position">
      <span class="time" id="clock">0.00</span>
      <nav class="langs" aria-label="Language"><a data-lang="ar" href="?lang=ar">عربي</a><a data-lang="en" href="?lang=en">EN</a></nav>
    </div>
  </main>
  <script src="js/core.js"></script>
  <script src="js/copy.js"></script>
  <script src="js/scenes_a.js"></script>
  <script src="js/scenes_b.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
