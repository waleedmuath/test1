<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoFunction — Motion Reel II</title>
<link rel="stylesheet" href="assets/site-fonts.css">
<style>
  :root { --ink:#0B0B0C; --surface:#141417; --line:#2A2A31; --cream:#F3EDE3; --muted:#8B857D; --fn:#FF5C00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--cream); font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; min-height: 100vh; }
  .frame { width: min(100%, calc((100vh - 110px) * 16 / 9)); }
  #stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 40px 120px rgba(255,92,0,.08); }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #overlay { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 11px 20px; border-radius: 999px; background: var(--fn); color: var(--ink); font-size: 13px; letter-spacing: .1em; font-weight: 500; cursor: pointer; transition: opacity .3s; white-space: nowrap; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  .bar { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .08em; color: var(--muted); direction: ltr; }
  button { font: inherit; font-weight: 500; letter-spacing: .1em; color: var(--ink); background: var(--cream); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; min-width: 84px; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--fn); outline-offset: 2px; }
  input[type=range] { flex: 1; accent-color: var(--fn); }
  #tc { color: var(--cream); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  #label { min-width: 90px; color: var(--fn); }
  .lang { display: flex; gap: 4px; }
  .lang a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .lang a[aria-current] { color: var(--ink); background: var(--fn); border-color: var(--fn); }
  body.capture { padding: 0; display: block; background: #000; }
  body.capture .frame { width: 1920px; }
  body.capture #stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
  body.capture .bar, body.capture #overlay { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div class="frame"><div id="stage"><canvas id="c" width="1920" height="1080" aria-label="JoFunction motion reel"></canvas><div id="overlay" role="button" tabindex="0">▶ Play with sound</div></div></div>
  <div class="frame bar">
    <button id="play" type="button">Play</button>
    <span id="tc">00.00</span>
    <input id="scrub" type="range" min="0" max="30" step="0.001" value="0" aria-label="Scrub timeline">
    <span id="label"></span>
    <nav class="lang" aria-label="Language"><a href="?lang=en" data-lang="en">EN</a><a href="?lang=ar" data-lang="ar">عربي</a></nav>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
