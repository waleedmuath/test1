<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoFunction Motion Reel</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --ink: #0B0B0C; --paper: #FAF8F6; --orange: #FF5C00; --mute: #8B857D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; min-height: 100vh; }
  .frame { width: min(100%, calc((100vh - 110px) * 16 / 9)); }
  #stage { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #overlay { position: absolute; inset: auto 0 0 0; margin: auto; width: max-content; bottom: 22px; padding: 10px 18px; border-radius: 999px;
    background: var(--orange); color: var(--ink); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; cursor: pointer; transition: opacity .3s; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  .bar { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .08em; color: var(--mute); }
  button { font: inherit; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--paper); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; min-width: 84px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  input[type=range] { flex: 1; accent-color: var(--orange); }
  #tc { color: var(--paper); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  body.capture { padding: 0; display: block; background: #000; }
  body.capture .frame { width: 1920px; }
  body.capture #stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
  body.capture .bar, body.capture #overlay { display: none; }
</style>
</head>
<body>
  <div class="frame">
    <div id="stage">
      <canvas id="c" width="1920" height="1080" aria-label="JoFunction motion reel"></canvas>
      <div id="overlay" role="button" tabindex="0">▶ Play with sound</div>
    </div>
  </div>
  <div class="frame bar">
    <button id="play" type="button">Play</button>
    <span id="tc">00.00</span>
    <input id="scrub" type="range" min="0" max="30" step="0.001" value="0" aria-label="Scrub timeline">
    <span>30.00</span>
  </div>
  <script src="js/core.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
